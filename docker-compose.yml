services:
  sarvam-bridge:
    build: .
    image: sarvam-bridge:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:?SARVAM_API_KEY must be set}
      NODE_ENV: production
      LOG_LEVEL: info
      CACHE_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-}
    # The gateway is stateless, so scaling is just more replicas.
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
